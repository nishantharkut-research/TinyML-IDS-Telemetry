[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tinyml-ids-telemetry"
version = "0.1.0"
description = "Big-data analytics for hardware-validated TinyML IDS telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Nishant Harkut" },
]
keywords = [
  "apache-kafka",
  "apache-spark",
  "big-data",
  "hadoop",
  "iot-security",
  "tinyml",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130,<7",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
kafka = [
  "kafka-python-ng>=2.2.3,<3",
]
spark = [
  "pyspark==4.1.3",
]
dashboard = [
  "pandas>=2.2,<4",
  "pyarrow>=15,<23",
  "streamlit>=1.44,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinyml_ids_telemetry"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "full_evidence: requires the external CuKD-XAI evidence repository",
  "integration: requires local distributed services or Docker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tinyml_ids_telemetry"]
mypy_path = "src"

