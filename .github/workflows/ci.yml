name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install verification dependencies
        run: python -m pip install -e ".[dev,kafka,spark,dashboard]"

      - name: Check formatting and lint
        run: |
          ruff check src dashboard jobs tests
          ruff format --check src dashboard jobs tests

      - name: Check types
        run: |
          mypy src dashboard
          mypy --explicit-package-bases jobs/spark/run_pipeline.py

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Validate Compose contract
        run: docker compose -f compose.yaml config --quiet

      - name: Run non-service tests
        run: python -m pytest -m "not integration and not full_evidence" -q
